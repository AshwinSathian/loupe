name: Publish to npm

# Publishes loupe-review when a GitHub release is published. Authentication is npm trusted publishing
# (OIDC): no npm token is stored in the repository. npm attaches provenance automatically.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Skip a version already on npm
        id: check
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "loupe-review@$v" version >/dev/null 2>&1; then echo "loupe-review@$v is already published"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
