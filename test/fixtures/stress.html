<!doctype html><html><head><style>
body{margin:0;font:16px/1.4 sans-serif}
#wide{width:600px;background:#eee}
.tab{display:inline-block;width:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#box{height:44px;overflow:hidden;font-size:16px}
#px{font-size:14px}
#rem{font-size:1rem}
table{width:900px}
</style></head><body>
<div id="wide">A fixed 600 px wide panel</div>
<span class="tab" id="tab">Save</span>
<div id="box" style="width:260px">Two short lines of text that fit</div>
<p id="px">Set in px</p><p id="rem">Set in rem</p>
<table><tr><td>Data tables may scroll</td></tr></table>
</body></html>
