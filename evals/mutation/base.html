<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewatch settings</title>
<style>
:root { color-scheme: light dark; --fg: #1d2127; --muted: #4a525e; --bg: #ffffff; --line: #8a919c; --accent: #0b57d0; }
@media (prefers-color-scheme: dark) { :root { --fg: #eef1f5; --muted: #b9c0ca; --bg: #14171c; --line: #6f7782; --accent: #8ab4f8; } }
* { box-sizing: border-box; }
body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
header, main, footer { padding: 1rem; max-width: 48rem; margin: 0 auto; }
nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 0; }
a { color: var(--accent); }
a, button, input, select { min-height: 2.75rem; }
nav a { display: inline-flex; align-items: center; padding: 0 .75rem; }
button { font: inherit; padding: 0 1rem; min-width: 2.75rem; border: 1px solid var(--line); border-radius: .5rem; background: transparent; color: var(--fg); }
input, select { font: inherit; padding: 0 .5rem; border: 1px solid var(--line); border-radius: .375rem; color: var(--fg); background: transparent; width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
label { display: block; margin: .75rem 0 .25rem; }
</style>
</head>
<body>
<header>
  <nav aria-label="Main"><ul id="tabs"><li><a href="#tides" id="tab-tides">Tides</a></li><li><a href="#swell" id="tab-swell">Swell forecast</a></li><li><a href="#settings" id="tab-settings" aria-current="page">Settings</a></li></ul></nav>
</header>
<main id="settings">
  <h1>Settings</h1>
  <p class="muted" id="intro">Choose which beaches Tidewatch alerts you about, and when.</p>
  <section class="card" id="alerts">
    <h2>Alerts</h2>
    <label for="beach">Home beach</label>
    <select id="beach"><option>Bells Beach</option><option>Torquay</option></select>
    <label for="height">Alert me when swell is above (m)</label>
    <input id="height" type="number" value="1.5" step="0.1">
    <div class="row" id="actions" style="margin-top:1rem">
      <button type="button" id="save">Save alerts</button>
      <button type="button" id="share" aria-label="Share settings"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="currentColor"/></svg></button>
    </div>
  </section>
  <section class="card" id="about">
    <h2>About the data</h2>
    <p id="about-text">Swell heights come from the nearest offshore buoy and are refreshed every 30 minutes.</p>
    <p><a href="#sources" id="sources-link" style="display:inline-flex;align-items:center">Data sources and accuracy</a></p>
  </section>
</main>
<footer id="foot"><p class="muted">Tidewatch 2.1 · <a href="#privacy" id="privacy">Privacy</a></p></footer>
</body>
</html>
